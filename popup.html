<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKK Lite</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.4;
    }

    body {
      box-sizing: border-box;
      width: 260px;
      margin: 0;
      padding: 14px;
      color: #172033;
      background: #f7f9fc;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    img {
      width: 36px;
      height: 36px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
    }

    .status {
      margin: 0 0 12px;
      color: #526174;
      font-size: 13px;
    }

    .actions {
      display: grid;
      gap: 8px;
    }

    button {
      box-sizing: border-box;
      width: 100%;
      min-height: 36px;
      border: 1px solid #c6d0dd;
      border-radius: 6px;
      background: #fff;
      color: #172033;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button.primary {
      border-color: #0f6fad;
      background: #0f6fad;
      color: #fff;
    }

    button:disabled {
      cursor: default;
      opacity: 0.58;
    }

    .hint {
      margin: 12px 0 0;
      color: #6a788a;
      font-size: 12px;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #e8edf5;
        background: #111827;
      }

      .status,
      .hint {
        color: #aeb8c7;
      }

      button {
        border-color: #344155;
        background: #172033;
        color: #e8edf5;
      }

      button.primary {
        border-color: #2f9ae0;
        background: #146fac;
        color: #fff;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>SKK Lite</h1>
  </header>
  <p id="status" class="status">Checking this page...</p>
  <div class="actions">
    <button id="enable" class="primary" type="button">Enable on this page</button>
    <button id="disable" type="button">Disable</button>
    <button id="options" type="button">Options</button>
  </div>
  <p class="hint">Shortcuts: Ctrl+J, Ctrl+Shift+K</p>
  <script src="popup.js"></script>
</body>
</html>
