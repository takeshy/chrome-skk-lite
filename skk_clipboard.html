<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKK Clipboard Input</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.4;
    }

    body {
      box-sizing: border-box;
      min-width: 420px;
      margin: 0;
      padding: 14px;
      color: #172033;
      background: #f7f9fc;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.2;
    }

    .mode {
      padding: 3px 7px;
      border-radius: 5px;
      background: #146fab;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 92px;
      resize: vertical;
      border: 1px solid #c6d0dd;
      border-radius: 6px;
      padding: 9px 10px;
      background: #fff;
      color: #172033;
      font: 18px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .candidate {
      box-sizing: border-box;
      min-height: 28px;
      margin-top: 8px;
      padding: 5px 7px;
      border: 1px solid transparent;
      border-radius: 6px;
      color: #166534;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .candidate[data-active="true"] {
      border-color: rgba(22, 101, 52, 0.26);
      background: #f0fdf4;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
    }

    .status {
      margin: 0;
      color: #526174;
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      min-height: 32px;
      border: 1px solid #c6d0dd;
      border-radius: 6px;
      padding: 5px 10px;
      background: #fff;
      color: #172033;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button.primary {
      border-color: #0f6fad;
      background: #0f6fad;
      color: #fff;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #e8edf5;
        background: #111827;
      }

      textarea,
      button {
        border-color: #344155;
        background: #172033;
        color: #e8edf5;
      }

      .status {
        color: #aeb8c7;
      }

      .candidate {
        color: #86efac;
      }

      .candidate[data-active="true"] {
        border-color: rgba(134, 239, 172, 0.34);
        background: rgba(20, 83, 45, 0.42);
      }

      button.primary {
        border-color: #2f9ae0;
        background: #146fac;
        color: #fff;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>SKK Clipboard Input</h1>
    <div id="mode" class="mode">SKK かな</div>
  </header>
  <textarea id="input" autocomplete="off" spellcheck="false" autofocus></textarea>
  <div id="candidate" class="candidate" data-active="false"></div>
  <div class="footer">
    <p id="status" class="status">Enter: copy / Shift+Enter: newline / Space: convert</p>
    <div class="actions">
      <button id="copy" class="primary" type="button">Copy</button>
      <button id="close" type="button">Close</button>
    </div>
  </div>
  <script src="skk_engine.js"></script>
  <script src="skk_clipboard.js"></script>
</body>
</html>
