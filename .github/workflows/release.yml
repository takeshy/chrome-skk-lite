name: Release Asset

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  upload-build-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build extension package
        run: node scripts/build_dictionary.js

      - name: Create release archive
        run: |
          cd build
          zip -r "chrome-skk-lite-${{ github.event.release.tag_name }}.zip" chrome-skk-lite

      - name: Upload archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "build/chrome-skk-lite-${{ github.event.release.tag_name }}.zip" --clobber
