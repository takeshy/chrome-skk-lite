name: Release Asset

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  upload-build-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify manifest version matches release tag
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const tag = process.env.RELEASE_TAG || "";
            const expected = `v${manifest.version}`;
            if (tag !== expected) {
              console.error(`Release tag ${tag} does not match manifest version ${manifest.version}; expected ${expected}.`);
              process.exit(1);
            }
          '
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Build extension package
        run: node scripts/package.js

      - name: Rename release archive
        run: mv build/chrome-skk-lite.zip "build/chrome-skk-lite-${{ github.event.release.tag_name }}.zip"

      - name: Upload archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "build/chrome-skk-lite-${{ github.event.release.tag_name }}.zip" --clobber
