name: Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get version from manifest.json
        id: version
        run: |
          version="$(node -p "require('./manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check if version tag exists
        id: check-tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build extension package
        if: steps.check-tag.outputs.exists == 'false'
        run: node scripts/package.js

      - name: Test GemiHub plugin adapter
        if: steps.check-tag.outputs.exists == 'false'
        run: node tests/gemihub_plugin.test.js

      - name: Rename release archive
        if: steps.check-tag.outputs.exists == 'false'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: mv build/chrome-skk-lite.zip "build/chrome-skk-lite-$RELEASE_TAG.zip"

      - name: Create draft release
        if: steps.check-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            build/chrome-skk-lite-${{ steps.version.outputs.tag }}.zip
            build/gemihub-skk-lite/manifest.json
            build/gemihub-skk-lite/main.js
            build/gemihub-skk-lite/dictionary.json
